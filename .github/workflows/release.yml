name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with test extras
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[test]'

      - name: pytest
        run: pytest

      - name: Verify the tag matches the declared version
        # `signage-controller upgrade` refuses an install whose reported version
        # does not match the release tag, so catch the mismatch here instead.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          declared="$(python -c 'import signage_controller; print(signage_controller.__version__)')"
          if [ "$tag" != "v${declared}" ]; then
            echo "tag ${tag} does not match __version__ ${declared}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.whl | sed 's| \./| |' > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl dist/SHA256SUMS
