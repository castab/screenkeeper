name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libsnappy build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsnappy-dev

      - name: Install project with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: pytest
        run: pytest

      - name: Byte-compile check
        run: python -m compileall -q src tests

      - name: Whitespace / conflict-marker check
        # AGENTS.md's `git diff --check` is meant for a dirty working tree
        # after local edits; on a clean CI checkout that diff is empty. Diff
        # against Git's well-known empty tree object instead to check the
        # entire tracked tree for trailing whitespace and conflict markers.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904

      - name: CLI entry-point smoke test
        run: |
          signage-controller --help
          signage-controller pair --help
          signage-controller playback --help
          signage-controller upgrade --help
          signage-controller --version

      - name: Installer and unit-file checks
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
          # bash and systemd both reject CRLF; .gitattributes pins these to LF.
          ! grep -rlU $'\r' scripts/install.sh packaging/
