[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signage-controller"
dynamic = ["version"]
description = "Local desired-state controller for LG webOS signage televisions and mpv signage playback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiowebostv>=0.9.2,<1.0",
  "aiohttp>=3.11",
  "PyYAML>=6.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
signage-controller = "signage_controller.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
# Single source of truth: the release tag, the built package, and the version
# an installed copy reports through `--version` must never disagree, because
# `signage-controller upgrade` compares them.
path = "src/signage_controller/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/signage_controller"]

[tool.hatch.build.targets.sdist]
# `upgrade` installs the sdist asset published with each release, so the sdist
# must carry everything needed to build and verify a host-native install.
include = [
  "src/signage_controller",
  "tests",
  "packaging",
  "scripts",
  # The shared API contract; tests/test_contracts.py checks the edge against it.
  "contracts",
  "README.md",
  "AGENTS.md",
  "config.example.yaml",
  "pyproject.toml",
]
