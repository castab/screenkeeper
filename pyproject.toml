[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signage-controller"
version = "0.1.0"
description = "Local desired-state controller for LG webOS signage televisions and mpv signage playback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiowebostv>=0.9.2,<1.0",
  "aiohttp>=3.11",
  "PyYAML>=6.0",
  "python-snappy>=0.7.3,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
signage-controller = "signage_controller.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/signage_controller"]
