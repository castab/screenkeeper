# Local development stack: PostgreSQL + Screenkeeper Control only.
# The Screenkeeper Edge/mpv player is never containerized and never belongs
# in this file -- it runs natively on the signage host and points its
# control_plane.base_url at this stack (http://localhost:8080).
#
# Usage:
#   cp .env.example .env   # then edit .env with your own values
#   docker compose -f compose.dev.yaml up -d

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: screenkeeper_control
      POSTGRES_USER: screenkeeper
      POSTGRES_PASSWORD: ${SCREENKEEPER_DATABASE_PASSWORD:?set SCREENKEEPER_DATABASE_PASSWORD in .env, see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - screenkeeper_control_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenkeeper -d screenkeeper_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  screenkeeper-control:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCREENKEEPER_CONTROL_HOST: 0.0.0.0
      SCREENKEEPER_CONTROL_PORT: "8080"
      SCREENKEEPER_DATABASE_URL: jdbc:postgresql://postgres:5432/screenkeeper_control
      SCREENKEEPER_DATABASE_USER: screenkeeper
      SCREENKEEPER_DATABASE_PASSWORD: ${SCREENKEEPER_DATABASE_PASSWORD:?set SCREENKEEPER_DATABASE_PASSWORD in .env}
      SCREENKEEPER_ADMIN_TOKEN: ${SCREENKEEPER_ADMIN_TOKEN:?set your own admin token in .env -- never commit it}
      SCREENKEEPER_HEARTBEAT_INTERVAL_SECONDS: "30"
      SCREENKEEPER_ONLINE_MULTIPLIER: "3"
      # Blank values disable object storage. Fill all five required S3 values
      # together to enable asset upload/finalization and signed manifests.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_UPLOAD_URL_TTL_SECONDS: ${S3_UPLOAD_URL_TTL_SECONDS:-3600}
      S3_DOWNLOAD_URL_TTL_SECONDS: ${S3_DOWNLOAD_URL_TTL_SECONDS:-3600}
      # To try OTel Java agent tracing locally, uncomment these and point
      # OTEL_EXPORTER_OTLP_ENDPOINT at an OTLP receiver reachable from this
      # container. This compose file has no Alloy of its own -- see
      # docs/architecture/observability.md "Local development". On Linux,
      # run deploy/alloy/dev/compose.yaml's Alloy on the same Docker network;
      # on Windows/Mac, host.docker.internal reaches a host-run receiver.
      # JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry-javaagent.jar"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318"
      # OTEL_SERVICE_NAME: "screenkeeper-control"
      # OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev"
    ports:
      - "8080:8080"

volumes:
  screenkeeper_control_pgdata:
