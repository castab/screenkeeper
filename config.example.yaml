# Copy to config.yaml, set the host, pair, then replace the input ID with the
# command-compatible ID reported by `signage-controller inputs dev-tv`.
reconcile_interval: 30
# Wait for webOS and HDMI services after a connection or power-on state update.
power_on_delay: 15

# Optional telemetry is activated only by `signage-controller run`.
# Set LOKI_TOKEN and PROMETHEUS_TOKEN in the service environment before use.
# observability:
#   loki:
#     url: https://loki.example.com/loki/api/v1/push
#     bearer_token_env: LOKI_TOKEN
#     labels:
#       environment: production
#   prometheus:
#     remote_write_url: https://prometheus.example.com/api/v1/write
#     bearer_token_env: PROMETHEUS_TOKEN
#     job: signage_controller
#     instance: signage-host-01
#     push_interval: 15

tvs:
  - id: dev-tv
    name: Development LG TV
    host: 192.168.1.50
    desired_input: HDMI_1
    desired_volume: 0

# Optional Screenkeeper Control connectivity, used only by `signage-controller
# device ...` and `signage-controller agent run`. Leaving this out keeps the
# appliance entirely local: TV control and mpv playback never consult it, and
# signage keeps running when the WAN is down. The player initiates every
# request, so no inbound access to this host is required.
# control_plane:
#   base_url: https://screenkeeper.example.com
#   heartbeat_interval: 30
#   request_timeout: 10
#   # HTTPS is required. Plain HTTP is accepted only for a loopback host, or
#   # when this is explicitly set for local development against a dev server.
#   # allow_insecure_http: false

# Optional local mpv signage playback, independent of TV control above.
# Requires mpv installed on this host; used only by `signage-controller
# playback ...` commands. See README.md for the full walkthrough.
# playback:
#   mpv_binary: mpv
#   restart_delay: 2
#   hwdec: auto
#   fullscreen: true
#   loop: true
#   audio: false
#   players:
#     - id: dev-menu
#       name: Development Menu
#       media: ./media/menu.mp4
#       tv_id: dev-tv
#       # Select a display for multi-monitor hosts (mutually exclusive):
#       # screen: 0
#       # screen_name: DP-1
