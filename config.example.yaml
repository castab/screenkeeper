# Copy to config.yaml, set the host, pair, then replace the input ID with the
# command-compatible ID reported by `signage-controller inputs dev-tv`.
reconcile_interval: 30
# Wait for webOS and HDMI services after a connection or power-on state update.
power_on_delay: 15

# Optional local Prometheus metrics, exposed only on this host (defaults to
# 127.0.0.1) for a host-level agent such as Grafana Alloy to scrape. This
# controller never sends metrics anywhere itself, and has no idea a central
# Prometheus/Grafana exists. `signage-controller playback run` shares this
# block but binds `port + 1`, since both commands can run on the same host.
# See docs/architecture/observability.md.
# metrics:
#   enabled: true
#   host: 127.0.0.1
#   port: 9464

# Optional OpenTelemetry tracing spans (TV commands, playback start, control-
# plane heartbeats), exported over OTLP to the same host-level agent's local
# receiver -- never to a remote/central URL. Like metrics, this controller
# holds no central credential; the push never leaves 127.0.0.1.
# See docs/architecture/observability.md.
# tracing:
#   enabled: true
#   endpoint: http://127.0.0.1:4318

tvs:
  - id: dev-tv
    name: Development LG TV
    host: 192.168.1.50
    desired_input: HDMI_1
    desired_volume: 0

# Optional Screenkeeper Control connectivity, used only by `signage-controller
# device ...` and `signage-controller agent run`. Leaving this out keeps the
# appliance entirely local: TV control and mpv playback never consult it, and
# signage keeps running when the WAN is down. The player initiates every
# request, so no inbound access to this host is required.
# control_plane:
#   base_url: https://screenkeeper.example.com
#   heartbeat_interval: 30
#   request_timeout: 10
#   # HTTPS is required. Plain HTTP is accepted only for a loopback host, or
#   # when this is explicitly set for local development against a dev server.
#   # allow_insecure_http: false

# Optional desired content synchronization. The content service downloads
# assigned videos into a persistent hash-addressed cache, verifies SHA-256,
# and only then makes them available to playback. Existing YAML media remains
# the fallback. Requires control_plane configuration and enrollment.
# content:
#   enabled: true
#   reconcile_interval: 300
#   download_timeout: 3600
#   # Defaults to <state-dir>/media; never place remote content under /etc.
#   # cache_dir: /var/lib/signage-controller/media

# Optional local mpv signage playback, independent of TV control above.
# Requires mpv installed on this host; used only by `signage-controller
# playback ...` commands. See README.md for the full walkthrough.
# playback:
#   mpv_binary: mpv
#   restart_delay: 2
#   hwdec: auto
#   fullscreen: true
#   loop: true
#   audio: false
#   players:
#     - id: dev-menu
#       name: Development Menu
#       media: ./media/menu.mp4
#       tv_id: dev-tv
#       # Select a display for multi-monitor hosts (mutually exclusive):
#       # screen: 0
#       # screen_name: DP-1
