# Copy to config.yaml, set the host, pair, then replace the input ID with the
# command-compatible ID reported by `signage-controller inputs dev-tv`.
reconcile_interval: 30
# Wait for webOS and HDMI services after a connection or power-on state update.
power_on_delay: 15

# Optional telemetry is activated only by `signage-controller run`.
# Set LOKI_TOKEN and PROMETHEUS_TOKEN in the service environment before use.
# observability:
#   loki:
#     url: https://loki.example.com/loki/api/v1/push
#     bearer_token_env: LOKI_TOKEN
#     labels:
#       environment: production
#   prometheus:
#     remote_write_url: https://prometheus.example.com/api/v1/write
#     bearer_token_env: PROMETHEUS_TOKEN
#     job: signage_controller
#     instance: signage-host-01
#     push_interval: 15

tvs:
  - id: dev-tv
    name: Development LG TV
    host: 192.168.1.50
    desired_input: HDMI_1
    desired_volume: 0
